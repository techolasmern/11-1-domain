<!-- js -> scripting language for web to interact with user -->
<!-- Used to create interactive & dynamic web pages -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JAVASCRIPT</h1>
    <script>
        // console.log(10);

        // variables -> container for storing data.
        // identifier -> name of the variable. -> name, username, first_name;

        // start with letter, _, $.

        // cases -> addressofuser -> addressOfUser; -> camelCase
                // -> addressofuser -> AddressOfUser; -> PascalCase
                // -> addressofuser -> address_of_user; -> snake_case
                // -> addressofuser -> address-of-user; -> kebab-case
                
        // keywords -> pre-reserved words. -> var, let, const, function, class, etc.

        // var, let, const 
        // es -> ecma script -> 
        // ES5 -> 2009, ES6 -> 2015
        // =, ==, ===
        var a = 999;
        console.log(a);
        // var -> re-declare, re-assign.
        a = 1000;
        console.log(a);

        let b = 888;
        console.log(b);
        // let -> re-assign. ()
        b = 111;
        console.log(b)
        
        const c = 777;
        console.log(c);

        const pi = 3.14;
        console.log(pi);
        
        // scope -> visibility of the variable.
        // global scope -> available in the whole code.
        // block scope -> available in the block where it is declared.
        // function scope -> available in the function where it is declared.

        // var -> re-declare & re-assign is possible.
        // let -> re-declare is not possible but re-assign is possible.
        // const -> re-declare & re-assign is not possible.

        // working -> js
        // ---------------------------

        // 2 phase -> memory phase, execution phase.
        // memory phase -> variables are declared but not initialized.
        // execution phase -> variables are initialized.

        // hoisting -> variables are moved to the top of the code.

        // undefined -> default value of the variable.
        // not defined -> variable is not declared.

        console.log(sample);
        let sample = 10;

        const e = 1; // value must be assigned.

       </script>
</body>
</html>
