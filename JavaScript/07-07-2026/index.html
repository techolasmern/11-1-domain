<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form class="frm" name="register" id="frm">
            <div>
                <label for="first_name">First Name:</label>
                <input type="text" name="first_name" id="first_name" placeholder="Eg: John">
                <span class="error"></span>
            </div>
            <div>
                <label for="last_name">Last Name:</label>
                <input type="text" name="last_name" id="last_name" placeholder="Eg: Doe">
                <span class="error"></span>
            </div>
            <div>
                <label for="phone">Phone:</label>
                <input type="text" name="phone" id="phone" placeholder="Eg: 1234567890">
                <span class="error"></span>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="text" name="email" id="email" placeholder="Eg: john.doe@example.com">
                <span class="error"></span>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" placeholder="Eg: 123456">
                <span class="error"></span>
            </div>
            <div>
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Eg: 123456">
                <span class="error"></span>
            </div>
            <button type="submit">Register</button>
            <span id="form-submitted"></span>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
